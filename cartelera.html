<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cartelera - Correlatividades Medicina UNLP</title>
    <link rel="stylesheet" href="APP/cartelera.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="privacy-notice" id="privacyBanner" style="display:none">🔒 Este sitio no comparte tus datos, tus datos se almacenan solo en tu navegador. <button class="privacy-close" onclick="document.getElementById('privacyBanner').style.display='none'">✕</button></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="arbol.html" class="btn-back">← Volver al Árbol</a>
        <h1>📋 Cartelera</h1>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="filter-group">
            <div class="filter-days-wrap" id="daysWrap">
                <input type="number" id="daysInput" class="filter-days-input" min="1" max="3650" value="90" aria-label="Cantidad de días" />
                <span class="filter-days-suffix">dias</span>
            </div>
            <button class="filter-btn" data-days="60" aria-pressed="false">60 días</button>
            <button class="filter-btn" data-days="30" aria-pressed="false">30 días</button>
            <button class="filter-btn" data-days="7" aria-pressed="false">7 días</button>
        </div>
        <div class="group-toggle">
            <button class="group-btn active" data-mode="subject" aria-pressed="true">Por materia</button>
            <button class="group-btn" data-mode="chrono" aria-pressed="false">Cronológico</button>
        </div>
        <button id="refreshBtn">🔄 Actualizar</button>
        <button id="markAllBtn">👁 todas leídas</button>
        <button id="notifyBtn">🔔 Notificarme</button>
        <button id="subscribeBtn" class="btn-subscribe">📬 Seleccionar otras materias</button>
    </div>

    <!-- Status Area -->
    <div id="status"></div>

    <!-- Catedra Selector (hidden by default) -->
    <div id="catedraSelector" style="display:none;"></div>

    <!-- Results Container -->
    <div id="results"></div>

    <script src="APP/materias.js"></script>
    <script src="APP/cartelera_ids.js"></script>
    <script src="APP/cartelera.js"></script>

    <!-- Notify Modal -->
    <div id="notifyModal" class="modal" style="display:none;">
      <div class="modal-content">
        <h2>🔔 Recibir notificaciones</h2>
        <p>Recibe un email cuando haya nuevas publicaciones en tus cátedras (chequeo diario a las 8am).</p>
        <input type="email" id="notifyEmail" placeholder="tu@email.com" />
        <div id="notifySubjects"></div>
        <label class="notify-subject-label notify-home-label">
          <input type="checkbox" id="notifyHomeCheckbox" class="notify-subject-checkbox" checked />
          🏛 Avisos Generales de la Facultad
        </label>
        <button id="notifySubscribeBtn">Suscribirme</button>
        <button id="notifyUnsubscribeBtn" class="unsubscribe-btn">
          <span class="unsubscribe-text">Remover mi email</span>
          <span class="hold-progress"></span>
        </button>
        <button id="notifyCloseBtn" class="modal-close">✕</button>
      </div>
    </div>

    <script>
    (function(){
      var KEY = 'lastVersion';
      var LOOP_KEY = 'lastReloadAttempt';
      var banner = document.getElementById('privacyBanner');
      fetch('version.json?' + Date.now())
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data){
          if (!data || !data.version) { if(banner) banner.style.display='flex'; return; }
          var last = null;
          try { last = localStorage.getItem(KEY); } catch(e) {}
          if (last !== data.version) {
            var now = Date.now();
            var lastAttempt = 0;
            try { lastAttempt = parseInt(localStorage.getItem(LOOP_KEY)) || 0; } catch(e) {}
            if (now - lastAttempt < 3000) { if(banner) banner.style.display='flex'; return; }
            try { localStorage.setItem(KEY, data.version); } catch(e) {}
            try { localStorage.setItem(LOOP_KEY, String(now)); } catch(e) {}
            location.reload(true);
          }
          if(banner) banner.style.display='flex';
        })
        .catch(function(){ if(banner) banner.style.display='flex'; });
    })();
    </script>
</body>
</html>
